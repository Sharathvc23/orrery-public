# Development tooling for the agent — the test runner, the linter, the type
# checker and their own dependencies. Exact pins, resolved together with
# requirements.lock so both files install into one environment without a
# conflict. NOT installed into the agent image or by `./orrery-up`: these used
# to sit in requirements.lock and shipped pytest, mypy and ruff into every
# running agent. CI installs this file after requirements.lock wherever it runs
# the agent's tests; nothing here is imported by community_member at runtime.
