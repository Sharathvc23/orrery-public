# Full-history secret scan.
#
# WHY THIS IS SEPARATE FROM `secret scan (new commits)` IN ci.yml. That job scans
# the PR range, which is the right shape for a merge gate: it prevents the NEXT
# secret without relitigating fixtures on every PR. But nothing in it ever
# answers "what is already in the history" — and at the moment this repo is
# flipped public, every commit on every branch becomes visible at once and
# permanently. "We scan new commits" and "the history is clean" are different
# claims, and only the second one matters at the flip.
#
# SCHEDULED, NOT A PR GATE. It asserts a property of the whole repository, so a
# red run means "something is in the history", not "this PR is wrong" — blocking
# an unrelated author on that would be the wrong incentive, and is how a gate
# gets bypassed with --admin. Weekly, because history is append-only and the PR
# gate already covers what is being added.
#
# It is green against a checked-in baseline of findings that have each been
# classified (docs/SECRET_SCAN_BASELINE.md). A NEW finding — one not in that
# baseline — fails the run. The ruleset is NOT loosened to achieve this: the
# scan uses the same pinned gitleaks and the same .gitleaks.toml as the merge
# gate, so both report the same answer for the same tree.
name: full-history secret scan

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-all-history:
    name: every commit and every blob on every ref
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 0 = all history for all branches and tags. A shallow checkout would
          # make this job report a clean history it never actually read, which
          # is worse than not running it — it would produce a false claim.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Remote refs are fetched but not checked out; `git rev-list --all` walks
      # local refs only, so without this the scan would silently cover just the
      # default branch — the same false-claim shape as a shallow checkout.
      - name: Make every remote branch a local ref
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$'); do
            git branch -f "$ref" "origin/$ref" >/dev/null 2>&1 || true
          done
          echo "reachable commits: $(git rev-list --all --count)"
      - name: Scan the full history against the classified baseline
        run: python3 scripts/full_history_secret_scan.py
