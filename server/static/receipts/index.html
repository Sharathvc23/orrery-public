<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapter Issuer Log — ARP Receipts</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: #0b0d12; color: #e6e8ee;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      header { padding: 20px 24px; border-bottom: 1px solid #1c2030; position: sticky; top: 0; background: #0b0d12cc; backdrop-filter: blur(8px); }
      h1 { margin: 0; font-size: 18px; }
      .sub { color: #8b90a0; font-size: 12px; margin-top: 2px; }
      main { max-width: 880px; margin: 0 auto; padding: 20px 24px 60px; }
      .meta { color: #8b90a0; font-size: 12px; margin-bottom: 14px; }
      .card { border: 1px solid #1c2030; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; background: #11141c; }
      .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .cat { font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #1c2030; }
      .when { color: #8b90a0; font-size: 11px; margin-left: auto; }
      .summary { margin: 8px 0 6px; }
      .cp { color: #8b90a0; font-size: 11px; }
      .sig { display: flex; gap: 8px; align-items: center; border-top: 1px solid #1c2030; padding-top: 8px; margin-top: 8px; }
      .ok { color: #4ade80; font-size: 11px; }
      code { color: #8b90a0; font-size: 11px; word-break: break-all; }
      .empty { color: #8b90a0; padding: 40px 0; text-align: center; }
      button { background: #1c2030; color: #e6e8ee; border: 1px solid #2a3042; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
          .refresh { margin-left: 10px; }
      .ok.verified { color: #4ade80; }
      .ok.invalid { color: #fb7185; }
      .outcome { color: #8b90a0; font-size: 11px; }
      .issuer { margin-left: auto; }
    </style>
  </head>
  <body>
    <header>
      <h1>Chapter Issuer Log</h1>
      <div class="sub">Signed ARP receipts the chapter has accepted — offline (local SQLite) mode.</div>
    </header>
    <main>
      <div class="meta">
        <span id="count">Loading…</span>
        <button id="refresh" class="refresh">Refresh</button>
      </div>
      <div id="list"></div>
    </main>
    <script type="module" src="/ui/receipts-boot.js"></script>
  </body>
</html>
